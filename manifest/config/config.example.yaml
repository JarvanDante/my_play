# my_play 播放网关(M1)
server:
  address: ":8006"

logger:
  level: "all"
  stdout: true

# 与 my_media 同一套 MinIO(只读)
minio:
  endpoint: "127.0.0.1:19000"   # Docker 内跑时改 minio:9000, 但注意 ts 302 预签名的 host 需浏览器可达
  access_key: "minioadmin"
  secret_key: "minioadmin123"
  bucket: "my-media"
  use_ssl: false

# 封面 AES-128-ECB, 必须 16 字节, 与 H5 VITE_AES_BNC_KEY 相同
image_aes:
  key: "525202f9149e061d"

play:
  # 必须与 my_media 的 play_gateway.secret 一致
  secret: "dev-play-secret-change-me"
  # 密钥轮换: 换新时旧密钥放这里, 过渡期后清空
  secret_secondary: ""
  # ts 预签名有效期(秒)
  presign_expire_sec: 300
  # 分片回源模式: presign(默认,302预签名) | proxy(网关代理直出,隐藏源站) | cdn(302到CDN签名URL)
  serve_mode: "presign"
  cdn:
    base_url: ""       # 形如 https://cdn.example.com (serve_mode=cdn 时必填)
    private_key: ""    # 阿里云 URL 鉴权 Type A 的鉴权 KEY

# 策略同步与统计上报的 my_media 地址(X-Play-Token 用 play.secret)
media:
  base_url: "http://127.0.0.1:8004"
  sync_interval_sec: 60
  report_interval_sec: 30
  revoke_sync_interval_sec: 15   # 链接失效闸同步间隔(秒), 越小越快生效
